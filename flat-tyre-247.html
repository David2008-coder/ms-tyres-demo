<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<title>Mobile Tyre Fitting Reading | FLAT TYRE 24/7 | MS Tyres</title>
<meta name="description" content="24/7 emergency mobile tyre fitting in Reading & surrounding areas. We come to you: new tyres, puncture repair, balancing, locking nut removal. Call 07460 002992." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--panel:#151515;--line:#2a2a2a;--red:#e10600;--yellow:#ffcc00;--text:#fff;--muted:#b5b5b5}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Barlow",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--yellow)}
h1,h2,h3{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.02em;line-height:1.05;margin:0}
h1{font-size:clamp(2.4rem,9vw,4.6rem);text-transform:uppercase}
h2{font-size:clamp(1.9rem,6vw,3rem);text-transform:uppercase;margin-bottom:.5rem}
h3{font-size:1.25rem;margin-bottom:.4rem}
.red{color:var(--red);display:block}
.container{width:min(1140px,100% - 2rem);margin-inline:auto}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border:2px solid transparent;border-radius:999px;font:700 1rem "Barlow",sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn-red{background:var(--red);color:#fff}
.btn-yellow{background:var(--yellow);color:#000}
.btn-outline{border-color:#fff;color:#fff;background:transparent}

.header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.95);backdrop-filter:blur(8px);border-bottom:3px solid var(--red)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0}
.header-call{padding:.6rem 1rem;font-size:.9rem;white-space:nowrap}
.nav{display:none;gap:1.4rem}
.nav a{color:#fff;text-decoration:none;font-weight:600}
.nav a:hover{color:var(--yellow)}

.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:#fff}
.logo-badge{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--red);border:3px solid #000;box-shadow:0 0 0 3px var(--red);font-family:"Anton",sans-serif;line-height:1;text-align:center}
.logo-badge span{font-size:.55rem;letter-spacing:.05em;margin-top:6px}
.logo-badge b{font-weight:400;font-size:1.35rem;color:var(--yellow);margin-bottom:6px}
.logo-text{font-weight:700;display:none}

.hero{padding-top:2rem;background:radial-gradient(circle at 80% 20%,rgba(225,6,0,.28),transparent 55%),var(--bg)}
.hero-grid{display:grid;gap:2rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.5rem;background:var(--panel);border:1px solid var(--line);padding:.35rem .9rem;border-radius:999px;font-weight:600;font-size:.9rem;margin:0 0 1rem}
.dot{width:10px;height:10px;border-radius:50%;background:#2ecc40;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.tagline{font-size:1.15rem;color:var(--muted);max-width:34rem;margin:1rem 0 1.5rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:.8rem}
.hero-points{list-style:none;padding:0;margin:1.5rem 0 0;display:grid;gap:.35rem;color:var(--muted)}
.hero-points li::before{content:"✔";color:var(--yellow);margin-right:.5rem}
.hero-visual{position:relative}
.hero-img,.hero-visual .img-fallback{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:3px solid var(--yellow);box-shadow:10px 10px 0 var(--red)}
.price-burst{position:absolute;left:-.5rem;bottom:-1.2rem;background:var(--yellow);color:#000;padding:.6rem 1.1rem;border-radius:14px;transform:rotate(-4deg);display:grid;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.price-burst small{font-weight:700}
.price-burst strong{font-family:"Anton",sans-serif;font-size:2.4rem;font-weight:400;line-height:1}
.img-fallback{background:repeating-linear-gradient(45deg,#1a1a1a 0 14px,#111 14px 28px);min-height:200px;border-radius:14px}

.ticker{margin-top:3rem;background:var(--yellow);color:#000;overflow:hidden;font-weight:700;border-block:3px solid #000;transform:skewY(-1deg)}
.ticker-track{display:flex;gap:2.5rem;width:max-content;padding:.7rem 0;animation:scroll 28s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}

.section{padding:4rem 0}
.section-alt{background:var(--panel)}
.lead{color:var(--muted);font-size:1.1rem;max-width:40rem;margin:0 0 2rem}
.grid{display:grid;gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.4rem;margin:0}
.section-alt .card{background:var(--bg)}
.card p{margin:0;color:var(--muted)}
.card:hover{border-color:var(--red)}
.icon{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--red);font-size:1.5rem;margin-bottom:1rem}
.photo-row{display:grid;gap:1rem;margin-top:2rem}
.photo-row img,.photo-row .img-fallback{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;border:1px solid var(--line)}

.step{position:relative;padding:1.4rem 1.4rem 1.4rem 5rem;background:var(--bg);border-radius:16px;border-left:5px solid var(--yellow)}
.step p{margin:0;color:var(--muted)}
.step-num{position:absolute;left:1.2rem;top:1.1rem;font-family:"Anton",sans-serif;font-size:2.6rem;color:var(--yellow);line-height:1}

.book-grid{display:grid;gap:2rem}
.note{color:var(--muted)}
.form{display:grid;gap:1rem;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:16px;padding:1.4rem}
.form label{display:grid;gap:.35rem;font-weight:600;font-size:.95rem}
.form input,.form select{width:100%;padding:.8rem;border-radius:10px;border:1px solid #3a3a3a;background:#0a0a0a;color:#fff;font:500 1rem "Barlow",sans-serif}
.form input:focus,.form select:focus{border-color:var(--yellow);outline:none;box-shadow:0 0 0 3px rgba(255,204,0,.3)}
.success{margin:0;padding:.8rem;border-radius:10px;background:rgba(46,204,64,.15);color:#7dffa0}

.pricing{display:grid;gap:2rem;align-items:center}
.price-card{background:var(--red);border-radius:20px;padding:2rem;text-align:center;box-shadow:8px 8px 0 var(--yellow)}
.price-card p{margin:.3rem 0 1rem}
.price-label{font-weight:700;font-size:1.1rem;margin:0}
.price-big{font-family:"Anton",sans-serif;font-size:5rem;line-height:1}
.price-big span{font-size:1.4rem;margin-right:.4rem}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:.6rem;padding:0;margin:0}
.chips li{padding:.5rem 1rem;border:1px solid var(--yellow);border-radius:999px;font-weight:600}

.stars{color:var(--yellow);letter-spacing:.2em;margin-bottom:.6rem}
.review footer{margin-top:1rem;font-weight:700;color:#fff}

.footer{background:#000;border-top:3px solid var(--red);padding:3rem 0 6rem}
.footer-inner{display:grid;gap:2rem}
.footer p{margin:.3rem 0;color:var(--muted)}
.footer-phone{font-family:"Anton",sans-serif;font-size:2rem}
.footer-phone a{color:var(--yellow);text-decoration:none}
.copy{text-align:center;margin-top:2rem;font-size:.85rem}
.float-call{position:fixed;right:1rem;bottom:1rem;z-index:60;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:.85rem 1.3rem;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.6)}

@media(min-width:640px){
  .services-grid,.reviews-grid{grid-template-columns:repeat(2,1fr)}
  .photo-row{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr 1fr}
  .form .full{grid-column:1/-1}
  .logo-text{display:block}
}
@media(min-width:900px){
  .nav{display:flex}
  .hero-grid{grid-template-columns:1.1fr .9fr}
  .services-grid{grid-template-columns:repeat(3,1fr)}
  .reviews-grid,.steps-grid{grid-template-columns:repeat(3,1fr)}
  .book-grid{grid-template-columns:.8fr 1.2fr;align-items:start}
  .pricing{grid-template-columns:.8fr 1.2fr}
  .footer-inner{grid-template-columns:1fr 1fr}
  .float-call{display:none}
  .footer{padding-bottom:3rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.0/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const PHONE_DISPLAY = "07460 002992";
const PHONE_TEL = "tel:+447460002992";
const WA = "https://wa.me/447460002992";

const SERVICES = [
  { icon: "⚡", title: "On-site 24/7 fast response", text: "A fitter dispatched straight to your location, day or night." },
  { icon: "🛞", title: "New tyres supplied", text: "All major brands, matched to your car and budget." },
  { icon: "🔧", title: "Fitted & balanced on the spot", text: "Fitted and balanced at your home, work or roadside." },
  { icon: "🩹", title: "Puncture repair", text: "Fast, safe repairs where the tyre is repairable." },
  { icon: "⚖️", title: "Wheel balancing", text: "Smooth driving with no steering wheel vibration." },
  { icon: "🔩", title: "TPMS valves & locking nut removal", text: "Lost your locking wheel nut key? We remove it." },
];

const STEPS = [
  { title: "Call or message us", text: "Tell us where you are, your tyre size and your car reg." },
  { title: "We drive to you", text: "Our fully equipped van arrives fast, any hour, Sunday to Friday." },
  { title: "Back on the road", text: "Tyre fitted, balanced and checked. You pay on completion." },
];

const VEHICLES = ["Hatchback", "Saloon", "SUV / 4x4", "Premium", "MPV"];
const AREAS = ["Reading", "Caversham", "Tilehurst", "Woodley", "Earley", "Wokingham", "Bracknell", "Theale", "Newbury", "Henley", "Maidenhead", "Basingstoke"];

const REVIEWS = [
  { name: "James R.", where: "Reading", text: "Flat on the A33 late at night. Fitter arrived quickly, sorted a new tyre on the spot. Brilliant service." },
  { name: "Priya S.", where: "Tilehurst", text: "Lost my locking wheel nut key and was stuck. Removed it with no damage to the wheel. Highly recommend." },
  { name: "Dan W.", where: "Wokingham", text: "Fitted two premium tyres on my driveway while I worked from home. Great price and very professional." },
];

function Img({ src, alt, className }) {
  const [failed, setFailed] = useState(false);
  if (failed) return <div className={`img-fallback ${className || ""}`} role="img" aria-label={alt} />;
  return <img className={className} src={src} alt={alt} loading="lazy" onError={() => setFailed(true)} />;
}

function Logo() {
  return (
    <a href="#top" className="logo" aria-label="Flat Tyre 24/7 home">
      <span className="logo-badge">
        <span>FLAT TYRE</span>
        <b>247</b>
      </span>
      <span className="logo-text">MS Tyres</span>
    </a>
  );
}

function Header() {
  return (
    <header className="header">
      <div className="container header-inner">
        <Logo />
        <nav className="nav" aria-label="Main">
          <a href="#services">Services</a>
          <a href="#how">How it works</a>
          <a href="#pricing">Pricing</a>
          <a href="#coverage">Coverage</a>
          <a href="#reviews">Reviews</a>
        </nav>
        <a className="btn btn-yellow header-call" href={PHONE_TEL}>
          CALL NOW: {PHONE_DISPLAY}
        </a>
      </div>
    </header>
  );
}

function Hero() {
  return (
    <section className="hero" id="top">
      <div className="container hero-grid">
        <div className="hero-copy">
          <p className="pill"><span className="dot" /> Open 24 hours · Sunday to Friday</p>
          <h1>
            MOBILE TYRE FITTING <span className="red">WE COME TO YOU!</span>
          </h1>
          <p className="tagline">We Come To You. Anytime, Anywhere. 24/7 Emergency Tyre Service.</p>
          <div className="hero-actions">
            <a className="btn btn-red" href={PHONE_TEL}>📞 Call {PHONE_DISPLAY}</a>
            <a className="btn btn-outline" href="#book">Book online</a>
          </div>
          <ul className="hero-points">
            <li>New tyres, all major brands</li>
            <li>Fitted &amp; balanced at your location</li>
            <li>Covering Reading &amp; surrounding areas</li>
          </ul>
        </div>
        <div className="hero-visual">
          <Img className="hero-img" src="https://source.unsplash.com/800x600/?mechanic,tyre,van" alt="Mobile tyre fitting van and mechanic" />
          <div className="price-burst">
            <small>Emergency call out from</small>
            <strong>£150</strong>
          </div>
        </div>
      </div>
      <div className="ticker" aria-hidden="true">
        <div className="ticker-track">
          {[...VEHICLES, ...VEHICLES, ...VEHICLES, ...VEHICLES].map((v, i) => (
            <span key={i}>✔ {v}</span>
          ))}
        </div>
      </div>
    </section>
  );
}

function Services() {
  return (
    <section className="section" id="services">
      <div className="container">
        <h2>What we do at your door</h2>
        <p className="lead">Everything a tyre shop does, brought to your driveway, workplace or roadside.</p>
        <div className="grid services-grid">
          {SERVICES.map((s) => (
            <article className="card" key={s.title}>
              <span className="icon" aria-hidden="true">{s.icon}</span>
              <h3>{s.title}</h3>
              <p>{s.text}</p>
            </article>
          ))}
        </div>
        <div className="photo-row">
          <Img src="https://source.unsplash.com/600x400/?car,tyre,mechanic" alt="Mechanic fitting a tyre at the roadside" />
          <Img src="https://source.unsplash.com/600x400/?car,tyre,closeup" alt="Close-up of a new car tyre" />
        </div>
      </div>
    </section>
  );
}

function HowItWorks() {
  return (
    <section className="section section-alt" id="how">
      <div className="container">
        <h2>How it works</h2>
        <div className="grid steps-grid">
          {STEPS.map((s, i) => (
            <div className="step" key={s.title}>
              <span className="step-num">{i + 1}</span>
              <h3>{s.title}</h3>
              <p>{s.text}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function BookingForm() {
  const empty = { name: "", phone: "", location: "", tyreSize: "", reg: "", issue: "Flat tyre", urgency: "Emergency, as soon as possible" };
  const [form, setForm] = useState(empty);
  const [sent, setSent] = useState(false);

  const set = (e) => setForm({ ...form, [e.target.name]: e.target.value });

  const submit = (e) => {
    e.preventDefault();
    const msg = [
      "Hi, I'd like to book a mobile tyre fitting.",
      `Name: ${form.name}`,
      `Phone: ${form.phone}`,
      `Location/Postcode: ${form.location}`,
      `Tyre size: ${form.tyreSize || "Not sure"}`,
      `Car reg: ${form.reg}`,
      `Issue: ${form.issue}`,
      `Urgency: ${form.urgency}`,
    ].join("\n");
    window.open(`${WA}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
    setSent(true);
  };

  return (
    <section className="section" id="book">
      <div className="container book-grid">
        <div>
          <h2>Book a fitter</h2>
          <p className="lead">Fill in the details and send them to us on WhatsApp. We reply with an arrival time and price.</p>
          <p className="note">Prefer to talk? <a href={PHONE_TEL}>Call {PHONE_DISPLAY}</a></p>
          <p className="note">The tyre size is printed on the tyre sidewall, for example 205/55 R16.</p>
        </div>
        <form className="form" onSubmit={submit}>
          <label>Name
            <input name="name" value={form.name} onChange={set} required autoComplete="name" />
          </label>
          <label>Phone
            <input name="phone" type="tel" value={form.phone} onChange={set} required autoComplete="tel" />
          </label>
          <label className="full">Location / postcode
            <input name="location" value={form.location} onChange={set} required placeholder="e.g. RG1 1AB" autoComplete="postal-code" />
          </label>
          <label>Tyre size
            <input name="tyreSize" value={form.tyreSize} onChange={set} placeholder="205/55 R16" />
          </label>
          <label>Car reg
            <input name="reg" value={form.reg} onChange={set} required placeholder="AB12 CDE" style={{ textTransform: "uppercase" }} />
          </label>
          <label>Issue type
            <select name="issue" value={form.issue} onChange={set}>
              <option>Flat tyre</option>
              <option>New tyres</option>
              <option>Puncture</option>
              <option>Other</option>
            </select>
          </label>
          <label>Urgency
            <select name="urgency" value={form.urgency} onChange={set}>
              <option>Emergency, as soon as possible</option>
              <option>Within a few hours</option>
              <option>Today</option>
              <option>Book for another day</option>
            </select>
          </label>
          <button className="btn btn-red full" type="submit">Send booking on WhatsApp</button>
          {sent && <p className="full success" role="status">WhatsApp opened with your details. Press send there to finish your booking.</p>}
        </form>
      </div>
    </section>
  );
}

function Pricing() {
  return (
    <section className="section section-alt" id="pricing">
      <div className="container pricing">
        <div className="price-card">
          <p className="price-label">Emergency call out</p>
          <p className="price-big"><span>from</span> £150</p>
          <p>Final price depends on the time scale and your tyre needs.</p>
          <a className="btn btn-yellow" href={PHONE_TEL}>Get a quote: {PHONE_DISPLAY}</a>
        </div>
        <div>
          <h2>Clear pricing, no surprises</h2>
          <p className="lead">We confirm the price before we set off. We fit every type of car:</p>
          <ul className="chips">
            {VEHICLES.map((v) => <li key={v}>{v}</li>)}
          </ul>
        </div>
      </div>
    </section>
  );
}

function Coverage() {
  return (
    <section className="section" id="coverage">
      <div className="container">
        <h2>Covering Reading &amp; surrounding areas</h2>
        <p className="lead">Open 24 hours, Sunday to Friday. If your area isn't listed, call and ask.</p>
        <ul className="chips">
          {AREAS.map((a) => <li key={a}>{a}</li>)}
        </ul>
      </div>
    </section>
  );
}

function Reviews() {
  return (
    <section className="section section-alt" id="reviews">
      <div className="container">
        <h2>What drivers say</h2>
        <div className="grid reviews-grid">
          {REVIEWS.map((r) => (
            <blockquote className="card review" key={r.name}>
              <div className="stars" aria-label="5 out of 5 stars">★★★★★</div>
              <p>{r.text}</p>
              <footer>{r.name}, {r.where}</footer>
            </blockquote>
          ))}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="container footer-inner">
        <div>
          <Logo />
          <p>Mobile Tyre Fitting MS Tyres. We come to you, anytime, anywhere.</p>
        </div>
        <div>
          <p className="footer-phone"><a href={PHONE_TEL}>{PHONE_DISPLAY}</a></p>
          <p>Open 24 hours, Sunday to Friday</p>
          <p>Reading &amp; surrounding areas</p>
          <a href={WA} target="_blank" rel="noopener noreferrer">Message us on WhatsApp</a>
        </div>
      </div>
      <p className="copy">© {new Date().getFullYear()} MS Tyres. All rights reserved.</p>
    </footer>
  );
}

function App() {
  return (
    <>
      <Header />
      <main>
        <Hero />
        <Services />
        <HowItWorks />
        <BookingForm />
        <Pricing />
        <Coverage />
        <Reviews />
      </main>
      <Footer />
      <a className="float-call" href={PHONE_TEL} aria-label="Call now">📞 Call now</a>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
